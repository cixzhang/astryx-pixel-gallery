name: Captures
options:
  bundleIdPrefix: io.github.cixzhang
  deploymentTarget:
    iOS: "17.0"
packages:
  Astryx:
    path: ../astryx/packages/native/apple
targets:
  Captures:
    type: application
    platform: iOS
    sources:
      - Sources
      - Screens
    dependencies:
      - package: Astryx
        product: Astryx
      - package: Astryx
        product: AstryxNative
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Captures
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cixzhang.AstryxCaptures
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
