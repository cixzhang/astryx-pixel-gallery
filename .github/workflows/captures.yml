# Capture Astryx Swift components in the iOS Simulator for review (scratch).
name: astryx-native-captures
# What to capture lives in capture.env: CAPTURES, space-separated
# <screen>:<meta/astryx commit> pairs; each screen is a file in
# Captures/Screens without .swift.
on:
  push:
    branches: [astryx-native-captures-f308]
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          # capture.env: CAPTURES="Icon:<sha> Avatar:<sha>"
          . ./capture.env
          echo "matrix=$(python3 -c 'import json,sys; print(json.dumps([dict(zip(("screen","ref"),c.split(":"))) for c in sys.argv[1:]]))' $CAPTURES)" >> "$GITHUB_OUTPUT"
  capture:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      REF: ${{ matrix.ref }}
      SCREENS: ${{ matrix.screen }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meta/astryx
          ref: ${{ env.REF }}
          path: astryx
          sparse-checkout: packages/native/apple
      - name: Overlay files from other commits
        # capture.env OVERLAYS_<Screen>: space-separated <sha>:<path> pairs, for
        # a screen that needs views from other open changes.
        run: |
          . ./capture.env
          eval "overlays=\${OVERLAYS_${SCREENS}:-}"
          for o in $overlays; do
            sha=${o%%:*}; path=${o#*:}
            git -C astryx fetch -q --depth 1 origin "$sha"
            mkdir -p "astryx/$(dirname "$path")"
            git -C astryx show "$sha:$path" > "astryx/$path"
            echo "overlaid $path from $sha"
          done
      - name: Keep only the requested screens and register them
        run: |
          cd Captures
          for f in Screens/*.swift; do
            n=$(basename "$f" .swift)
            case " $SCREENS " in *" $n "*) ;; *) rm "$f" ;; esac
          done
          {
            echo 'import SwiftUI'
            echo '@ViewBuilder @MainActor func captureScreen(named name: String) -> some View {'
            echo '  switch name {'
            for n in $SCREENS; do echo "  case \"$n\": ${n}Screen()"; done
            echo '  default: SwiftUI.Text("No screen \(name)")'
            echo '  }'
            echo '}'
          } > Sources/Registry.swift
          cat Sources/Registry.swift
      - name: Build
        run: |
          brew install xcodegen
          cd Captures
          xcodegen generate
          . ../capture.env
          # capture.env XCODE_MAJOR / RUNTIME_MAJOR: build with the newest
          # installed Xcode of that major version and boot the newest iOS
          # runtime of that major version (e.g. 26 for Liquid Glass).
          RUNTIME=com.apple.CoreSimulator.SimRuntime.iOS-18-5
          if [ -n "${XCODE_MAJOR:-}" ]; then
            XC=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app | sort -V | tail -1)
            sudo xcode-select -s "$XC"; xcodebuild -version
          fi
          if [ -n "${RUNTIME_MAJOR:-}" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['version'].split('.')[0]=='${RUNTIME_MAJOR}' and x.get('isAvailable')]; r.sort(key=lambda x:[int(p) for p in x['version'].split('.')]); print(r[-1]['identifier'] if r else '')")
            if [ -z "$RUNTIME" ]; then xcodebuild -downloadPlatform iOS; RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x.get('isAvailable')]; r.sort(key=lambda x:[int(p) for p in x['version'].split('.')]); print(r[-1]['identifier'])"); fi
          fi
          echo "runtime: $RUNTIME"
          UDID=$(xcrun simctl create captures "iPhone 16" "$RUNTIME")
          echo "$UDID" > ../udid.txt
          xcrun simctl boot "$UDID"
          if ! xcodebuild -project Captures.xcodeproj -scheme Captures -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1; then
            grep -n -B2 -A8 -E "error:" build.log | head -150
            exit 1
          fi
      - name: Screenshots
        run: |
          set -euo pipefail
          UDID=$(cat udid.txt)
          APP=$(find Captures/build -type d -name Captures.app -path '*iphonesimulator*' | head -1)
          OUT=out; mkdir -p $OUT
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$UDID" "$APP"
          # Skip the keyboard's first-run tutorial, which covers a focused field.
          for k in DidShowContinuousPathIntroduction DidShowGestureKeyboardIntroduction; do
            xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences "$k" -bool true || true
          done
          . ./capture.env
          for screen in $SCREENS; do
            # capture.env per screen: ARGS_<Screen> extra launch arguments,
            # SIZES_<Screen> (default "large ax5"), STATES_<Screen> (launched
            # with -state <s>, one still each), VIDEO_<Screen> (a state to
            # record as video).
            eval "extra=\${ARGS_${screen}:-}"; eval "sizes=\${SIZES_${screen}:-large ax5}"
            eval "states=\${STATES_${screen}:-}"; eval "video=\${VIDEO_${screen}:-}"
            if [ -n "$states" ] || [ -n "$video" ]; then
              for mode in light dark; do
                xcrun simctl ui "$UDID" appearance "$mode"
                for st in $states; do
                  # A state ending in -ic runs with Increase Contrast on.
                  case "$st" in *-ic) ic=enabled ;; *) ic=disabled ;; esac
                  xcrun simctl ui "$UDID" increase_contrast "$ic" || true
                  # A state ending in -rt runs with Reduce Transparency on.
                  case "$st" in *-rt) rt=true ;; *) rt=false ;; esac
                  for k in EnhancedBackgroundContrastEnabled ReduceTransparencyEnabled; do
                    xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility "$k" -bool "$rt" || true
                  done
                  xcrun simctl launch --terminate-running-process "$UDID" io.github.cixzhang.AstryxCaptures -screen "$screen" $extra -state "$st" >/dev/null
                  sleep 5
                  xcrun simctl io "$UDID" screenshot "$OUT/$screen-$mode-$st.png"
                done
                if [ -n "$video" ]; then
                  xcrun simctl launch --terminate-running-process "$UDID" io.github.cixzhang.AstryxCaptures -screen "$screen" $extra -state "$video" >/dev/null
                  xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/$screen-$mode-$video.mp4" & REC=$!
                  sleep 11; kill -INT $REC; wait $REC || true
                fi
              done
              continue
            fi
            for mode in light dark; do
              xcrun simctl ui "$UDID" appearance "$mode"
              for size in large ax5; do
                args=(-screen "$screen")
                if [ "$size" = ax5 ]; then args+=(-UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityXXXL); fi
                xcrun simctl launch --terminate-running-process "$UDID" io.github.cixzhang.AstryxCaptures "${args[@]}" >/dev/null
                sleep 4
                xcrun simctl io "$UDID" screenshot "$OUT/$screen-$mode-$size.png"
                if [ "$size" = ax5 ]; then
                  xcrun simctl launch --terminate-running-process "$UDID" io.github.cixzhang.AstryxCaptures "${args[@]}" -scrollToEnd YES >/dev/null
                  sleep 4
                  xcrun simctl io "$UDID" screenshot "$OUT/$screen-$mode-$size-end.png"
                fi
              done
            done
          done
          if ls $OUT/*.mp4 >/dev/null 2>&1; then
            brew install ffmpeg >/dev/null
            for v in $OUT/*.mp4; do
              ffmpeg -loglevel error -y -i "$v" -vf "scale=-2:1280,scale=out_range=tv,format=yuv420p" -c:v libvpx-vp9 -b:v 0 -crf 36 -row-mt 1 -an "${v%.mp4}.webm"
            done
          fi
          { echo "astryx ref: $REF"; xcodebuild -version; xcrun simctl getenv "$UDID" SIMULATOR_RUNTIME_VERSION || true; } > $OUT/manifest.txt
          ls -la $OUT
      - uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.screen }}
          path: out
